[Loader]
Enabled=1
Version=1
HotReload=0
; Set HotReload=1 and restart to enable Alt+F5 hot reload; 0 keeps it disabled.
; LoggerHooks=0 disables the optional PuerTS diagnostic hooks (mods still load).
LoggerHooks=1
; SafeMode=1 disables logger hooks and hot reload for one troubleshooting run.
SafeMode=0
; Total evidence directory budget. Default 100 MiB; valid 16-512 MiB.
LogDirectoryLimitMiB=100
; Keep up to this many ordinary runs (best effort). Range 1-100.
LogRetentionRuns=10
; Failed/verification runs are pinned, but capped; range 0-10.
LogPinnedMax=3
; Evidence segment size in MiB (1-64).
LogSegmentMiB=8
; full writes all lines; errors writes only warnings/errors; off writes none but still enforces the budget.
LogMode=full

; Automatically loads mods/<id>/main.js in ID order on each launch.
; Add an ID below with value 0 to disable it; remove the line or use 1 to enable.
[Mods]
; your-mod-id=0
